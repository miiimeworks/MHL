; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=Aut2Exe MIIIME Launcher
AppName=Aut2Exe
ExeName=Aut2Exe_x64.exe
UniqueMutex=Aut2Exe_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\AutoIt3\Aut2Exe

[TraceClean]
SmartSkip=2
;Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0
