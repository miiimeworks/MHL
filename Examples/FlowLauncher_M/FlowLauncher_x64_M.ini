; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=FlowLauncher MIIIME Launcher
AppName=FlowLauncher
ExeName=Flow.Launcher.exe
ExeName64=
UniqueMutex=FlowLauncher_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\FlowLauncher_x64
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[CleanupExclude]
SmartSkip=2
;01={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json
;02={Dat}\profile\places.sqlite

[CleanupDelete]
SmartSkip=2
01={Dat}\Set\UserData\Cache
02={Dat}\Set\UserData\Logs

[ShortcutGuard]
;Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[TraceClean]
SmartSkip=2
;Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0