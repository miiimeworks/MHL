; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=1
RunAsAdmin=0
LauncherName=PotPlayer64 Miime Launcher
AppName=PotPlayer64
ExeName=PotPlayer.exe
ExeName64=PotPlayer64.exe
UniqueMutex=PotPlayer_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
;ShortcutGuard=|TargetApp|TargetApp64|TargetApp+|
WorkDir=
PreRun=
PostRun=

[Directories]
RunPath=App\PotPlayer64
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[ProcessWatch]
01=PotPlayer64.exe
02=PotPlayerMini64.exe
03=PotPlayerXP64.exe
04=PotPlayerMiniXP64.exe
05=PotPlayer.exe
06=PotPlayerMini.exe
07=PotPlayerXP.exe
08=PotPlayerMiniXP.exe

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\DAUM\PotPlayer64
02=HKEY_CURRENT_USER\SOFTWARE\DAUM\PotPlayerMini64
03=HKEY_CURRENT_USER\SOFTWARE\PotPlayer64
04=HKEY_CURRENT_USER\SOFTWARE\PotPlayerMini64

[RegistryRoot]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\DAUM
02=HKEY_CURRENT_USER\SOFTWARE\Kakao

[Assets]
SmartSkip=1
01=*|{Run}

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
UserFileBlacklist=|AppData|Desktop|Documents|Downloads|Favorites|Links|Music|Pictures|Saved Games|Searches|Videos|OneDrive|Dropbox|Google Drive|IntelGraphicsProfiles|.oracle_jre_usage|ntuser.dat|ntuser.dat.log1|ntuser.dat.log2|ntuser.ini|
CleanupFolderExclusions=|Microsoft|Windows|Packages|Boot|PerfLogs|
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0