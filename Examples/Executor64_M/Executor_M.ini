; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=Executor MIIIME Launcher
AppName=Executor
ExeName=Executor.exe
;ExeName64=Executor64.exe
UniqueMutex=Executor_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
;ShortcutGuard=|Executor|Executor64|Executor+|
WorkDir=
PreRun=
PostRun=

[Directories]
RunPath=App\Executor64bit
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Environment]
;PATH01={Env}\System32
;PATH02={Env}\SysWOW64

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[ProcessWatch]
;01=Executor-highdpi.exe

[ProcessKill]
;01=Executor-highdpi.exe

[CleanupDelete]
SmartSkip=2
01={Dat}\AppDat\Roaming\Executor\*.bak
02={Dat}\AppDat\Roaming\Executor\Apps

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
UserFileBlacklist=|AppData|Desktop|Documents|Downloads|Favorites|Links|Music|Pictures|Saved Games|Searches|Videos|OneDrive|Dropbox|Google Drive|IntelGraphicsProfiles|.oracle_jre_usage|ntuser.dat|ntuser.dat.log1|ntuser.dat.log2|ntuser.ini|
CleanupFolderExclusions=|Microsoft|Windows|Packages|Boot|PerfLogs|
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0