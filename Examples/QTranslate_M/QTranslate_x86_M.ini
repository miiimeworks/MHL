; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=QTranslate MIIIME Launcher
AppName=QTranslate
ExeName=QTranslate.exe
ExeName64=
UniqueMutex=QTranslate_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\QTranslate
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Environment]
;PATH01={Env}\System32
;PATH02={Env}\SysWOW64

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\Software\QTranslate"

[Assets]
SmartSkip=1
01=*|{Run}

[ShortcutGuard]
;Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[TraceClean]
SmartSkip=2
;Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0

