; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=1
RunAsAdmin=0
LauncherName=Obsidian MIIIME Launcher
AppName=Obsidian
ExeName=Obsidian.exe
ExeName64=
UniqueMutex=Obsidian_MIIIME_Mutex
AllowMultipleInstances=0
WorkDir=
PreRun=
PostRun=

[Directories]
RunPath=App\Obsidian
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[Registry]
01=HKEY_CURRENT_USER\SOFTWARE\Classes\obsidian

[RegistryFix]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\Classes\obsidian\shell\open\command||"{Run}\Obsidian.exe" -- "%1"|REG_SZ

[FileWrite]
SmartSkip=1
01={Dat}\AppDat\Roaming\obsidian\obsidian.json|Key:path|{Base}\Vault

[ProcessWatch]
01=installer.exe

[CleanupExclude]
SmartSkip=2

01={Dat}\AppDat\Roaming\obsidian\IndexedDB
02={Dat}\AppDat\Roaming\obsidian\Local Storage
03={Dat}\AppDat\Roaming\obsidian\Session Storage
04={Dat}\AppDat\Roaming\obsidian\WebStorage
05={Dat}\AppDat\Roaming\obsidian\obsidian.json
06={Dat}\AppDat\Roaming\obsidian\DIPS
07={Dat}\AppDat\Roaming\obsidian\id
08={Dat}\AppDat\Roaming\obsidian\Local State
09={Dat}\AppDat\Roaming\obsidian\Preferences
10={Dat}\AppDat\Roaming\obsidian\Network
11={Dat}\AppDat\Roaming\obsidian\^^^^^^^^^^^^^^^^.json

[CleanupDelete]
SmartSkip=2

20={Local}\Obsidian\CrashReports

21={Run}\Squirrel-CheckForUpdate.log
22={Run}\Squirrel-ProcessStart.log
23={Run}\Squirrel-Shortcut.log

24={Programs}\Obsidian
25={StartMenu}\Obsidian
26={CommonPrograms}\Obsidian
27={CommonStartMenu}\Obsidian
28={Programs}\Obsidian.lnk
29={StartMenu}\Obsidian.lnk
30={CommonPrograms}\Obsidian.lnk
31={CommonStartMenu}\Obsidian.lnk
32={Desktop}\Obsidian.lnk

[Assets]
SmartSkip=1
;01=*|{Run}

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
UserFileBlacklist=|AppData|Desktop|Documents|Downloads|Favorites|Links|Music|Pictures|Saved Games|Searches|Videos|OneDrive|Dropbox|Google Drive|IntelGraphicsProfiles|.oracle_jre_usage|ntuser.dat|ntuser.dat.log1|ntuser.dat.log2|ntuser.ini|
CleanupFolderExclusions=|Microsoft|Windows|Packages|Boot|PerfLogs|
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0