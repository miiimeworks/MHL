; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
TraceClean=0
RunAsAdmin=0
LauncherName=CursorFX MIIIME Launcher
AppName=CursorFX
ExeName=CursorFX.exe
UniqueMutex=CursorFX_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\CursorFX
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\Stardock\CursorFX\

[ShortcutGuard]
;Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

