; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=ACDSee32 MIIIME Launcher
AppName=ACDSee32
ExeName=ACDSee32.exe
UniqueMutex=ACDSee32_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=1
WorkDir=

[Directories]
RunPath=App\ACDSee32
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\ACD Systems\ACDInTouch
02=HKEY_CURRENT_USER\SOFTWARE\ACD Systems\ACDSee32
03=HKEY_CURRENT_USER\SOFTWARE\ACD Systems\PlugIns
04=HKEY_LOCAL_MACHINE\SOFTWARE\ACD Systems\ACDSee32

[RegistryRoot]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\ACD Systems
04=HKEY_LOCAL_MACHINE\SOFTWARE\ACD Systems

[RegistryFix]
SmartSkip=1
01=HKEY_CURRENT_USER\SOFTWARE\ACD Systems\ACDSee32|ImageDB|{Dat}\ImageDB\ImageDB.aid

[ShortcutGuard]
;Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[TraceClean]
SmartSkip=2
;Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0