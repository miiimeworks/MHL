; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=GoogleEarthPro MIIIME Launcher
AppName=GoogleEarthPro
ExeName=googleearth.exe
ExeName64=
UniqueMutex=googleearth_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
;ShortcutGuard=|GoogleEarthPro|GoogleEarthPro64|
WorkDir=
PreRun=
PostRun=

[Directories]
RunPath=App\GoogleEarthPro64
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Environment]
;PATH01={Env}\System32
;PATH02={Env}\SysWOW64

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
LogLevel=0
AddCommand=

[ProcessWatch]
01=gpsbabel.exe
02=repair_tool.exe

[ProcessKill]
01=gpsbabel.exe
02=repair_tool.exe

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\Google\Google Earth Pro
02=HKEY_CURRENT_USER\SOFTWARE\Google\Update
03=HKEY_CURRENT_USER\SOFTWARE\Google\GECommonSettings
04=HKEY_LOCAL_MACHINE\SOFTWARE\Google\Google Earth Pro

[RegistryRoot]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\Google
02=HKEY_LOCAL_MACHINE\SOFTWARE\Google

[RegistryShell]
SmartSkip=0
;01=Directory|GoogleEarthPro64_Open|Open with GoogleEarthPro64|"{Exe}" "%1"|"{Exe}"

[RegistryFix]
SmartSkip=1
;01=HKEY_CURRENT_USER\Software\VendorName\GoogleEarthPro64|InstallPath|{Run}

[FileWrite]
SmartSkip=1
;01={Run}\settings.ini|Section:Main|Key:SavePath|{Dat}\Saves

[CleanupExclude]
SmartSkip=2
;01={Dat}\profile\places.sqlite

[CleanupDelete]
SmartSkip=2
01={Dat}\AppDat\LocalLow\Google\GoogleEarth\Cache

[Assets]
SmartSkip=1
;01=*|{Run}

[UserFile]
SmartSkip=0
;01=Drivers\my_driver.sys|{System32}\drivers\my_driver.sys

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
UserFileBlacklist=|AppData|Desktop|Documents|Downloads|Favorites|Links|Music|Pictures|Saved Games|Searches|Videos|OneDrive|Dropbox|Google Drive|IntelGraphicsProfiles|.oracle_jre_usage|ntuser.dat|ntuser.dat.log1|ntuser.dat.log2|ntuser.ini|
CleanupFolderExclusions=|Microsoft|Windows|Packages|Boot|PerfLogs|
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0