; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 함.
; This file must be saved in ANSI encoding.

[Launch]
CrashRecovery=0
RunAsAdmin=0
LauncherName=PotPlayer MIIIME Launcher
AppName=PotPlayer64
ExeName=PotPlayer64.exe
UniqueMutex=PotPlayer_MIIIME_Mutex
AllowMultipleInstances=1
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\PotPlayer_x64
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Options]
UseJunction=0
FreezeMode=1
DetectReadOnly=0
LogLevel=0
AddCommand=

[ProcessWatch]
01=PotPlayer64.exe
02=PotPlayerMini64.exe
03=PotPlayerXP64.exe
04=PotPlayerMiniXP64.exe
05=PotPlayer.exe
06=PotPlayerMini.exe
07=PotPlayerXP.exe
08=PotPlayerMiniXP.exe

[Registry]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\DAUM\PotPlayer64
02=HKEY_CURRENT_USER\SOFTWARE\DAUM\PotPlayerMini64
03=HKEY_CURRENT_USER\SOFTWARE\PotPlayer64
04=HKEY_CURRENT_USER\SOFTWARE\PotPlayerMini64

[RegistryRoot]
SmartSkip=0
01=HKEY_CURRENT_USER\SOFTWARE\DAUM
02=HKEY_CURRENT_USER\SOFTWARE\Kakao

[Assets]
SmartSkip=1
01=*|{Run}

[ShortcutGuard]
;Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[TraceClean]
SmartSkip=2
;Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
;Splash=Splash.png
;SplashDuration=1500

[Advanced]
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0
