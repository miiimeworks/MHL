; 가이드 파일임. 실제 사용 시 파일명을 TargetApp_M.ini 형식으로 변경할 것.
; This is a guide file. Rename file name to TargetApp_M.ini format.
; 런처 이름이 TargetApp_x64_M.exe / TargetApp_x86_M.exe 이면 아래 순서로 처음 존재하는 INI 를 사용함.
;   x64 : TargetApp_x64_M.ini -> TargetApp_M.ini -> TargetApp_x86_M.ini
;   x86 : TargetApp_x86_M.ini -> TargetApp_M.ini -> TargetApp_x64_M.ini
; If the launcher is named TargetApp_x64_M.exe / TargetApp_x86_M.exe, the first INI that exists in the order above is used.

; =======================================================================================
; x86 / x64 구분 기준 / When to Split x86 and x64
; =======================================================================================
;
; 런처는 비트별로 따로 빌드함. 아래 [1] 에 해당하면 런처와 타겟의 비트가 같아야 함.
; The launcher is built per bitness. If [1] below applies, the launcher and the target must match in bitness.
;
; [1] 런처 비트 구분이 필요한 경우 / Launcher split is required when:
;   - [Registry] / [RegistryFix] / [RegistryRoot] 에 HKLM\SOFTWARE 하위 키(공유 키 제외),
;     또는 HKCU\SOFTWARE\Classes 의 CLSID / Interface / Media Type / DirectShow / MediaFoundation 이 있음.
;     (HKCU\SOFTWARE\VendorName 같은 일반 키는 해당 없음)
;   - [UserFile] / [Assets] / [FileWrite] 등에서 {System32} 경로를 대상으로 함.
;   - [Registry]/[RegistryFix]/[RegistryRoot] use keys under HKLM\SOFTWARE (excluding shared keys),
;     or CLSID / Interface / Media Type / DirectShow / MediaFoundation under HKCU\SOFTWARE\Classes.
;     (Ordinary keys such as HKCU\SOFTWARE\VendorName are not affected.)
;   - [UserFile] / [Assets] / [FileWrite] etc. target a {System32} path.
;
; [2] INI 만 구분하면 되는 경우 / Only the INI needs to be split when:
;   - ExeName / RunPath / PATH / JAVA_HOME / AddCommand / ProcessKill 등의 값이 x86 과 x64 에서 서로 다름.
;   - Values such as ExeName / RunPath / PATH / JAVA_HOME / AddCommand / ProcessKill differ between x86 and x64.
;
; [1] [2] 에 모두 해당하지 않으면 x86 / x64 를 구분할 필요 없음 (런처 1개 + INI 1개).
; 이 경우 로그의 비트 불일치 WARN 은 무시해도 됨.
; If neither [1] nor [2] applies, there is no need to split x86 / x64 (one launcher + one INI).
; In that case, the bitness-mismatch WARN in the log can be ignored.

; =======================================================================================
; 폴더 구조 / Folder Structure
; =======================================================================================
;
;   TargetApp_M/
;   │
;   ├─ TargetApp_M.exe  		런처 실행 파일			/ Launcher executable
;   ├─ TargetApp_M.ini  		설정 파일				/ Configuration file
;   ├─ TargetApp_M.log     		실행 로그				/ Runtime log
;   │
;   ├─ App/						핵심 파일 및 템플릿		/ Core Files & Templates
;   │   │                       (RunPath / ExtPath / RawDataPath 기본값 기준)
;   │   ├─ TargetApp/      		타겟 앱 바이너리			/ Target app binaries
;   │   │
;   │   ├─ Ext/            		추가 파일 루트			/ Extra files root
;   │   │   ├─ Ast/        		1회 주입 에셋			/ One-time injection assets
;   │   │   ├─ Env/        		환경설정용 파일			/ Environment File
;   │   │   ├─ Org/        		초기화 설정 (기능없음)	/ Factory Reset (Stub)
;   │   │   └─ Res/        		UI 리소스				/ UI resources
;   │   │
;   │   └─ RawDat/         		데이터 초기 템플릿		/ Default data template
;   │       ├─ AppDat/     		앱데이터 샌드박스			/ AppData sandbox
;   │       │   ├─ Local/  		%LocalAppData% 대체		/ %LocalAppData% substitute
;   │       │   ├─ LocalLow/ 	%LocalLow% 대체			/ %LocalLow% substitute
;   │       │   └─ Roaming/ 	%AppData% 대체			/ %AppData% substitute
;   │       ├─ Reg/        		레지스트리 템플릿			/ Registry templates
;   │       ├─ Set/        		이식용 설정 파일			/ Portable settings
;   │       └─ Usr/        		User File 				/ 사용자 파일 *
;   │
;   └─ Dat/                		사용자 데이터 저장소		/ Active user data
;
;   * Usr 폴더는 고급 사용자 전용.
;   * Usr folder is ADVANCED USERS ONLY.

