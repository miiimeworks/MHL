; =======================================================================================
; 윈도우 표준 환경 변수 / Windows Standard Environment Variables
; =======================================================================================
; %변수명% 형식으로 사용. 변수명은 대소문자를 구분하지 않음.
; Use %VariableName% format. Variable names are case-insensitive.
;
;   %USERPROFILE%              	현재 사용자 홈 폴더			/ Current user home folder
;   %USERNAME%                 	현재 사용자 계정 이름			/ Current user account name
;   %APPDATA%                  	앱 데이터 (로밍)				/ AppData\Roaming
;   %LOCALAPPDATA%             	앱 데이터 (로컬)				/ AppData\Local
;   %TEMP% 또는 %TMP%    		임시 파일 폴더				/ Temporary files folder
;
;   %SystemRoot% 또는 %WINDIR%  	윈도우 설치 폴더				/ Windows installation folder
;   %SystemDrive%              	시스템 설치 드라이브			/ System drive letter
;   %ProgramFiles%             	64비트 프로그램 설치 경로		/ 64-bit Program Files
;   %ProgramFiles(x86)%        	32비트 프로그램 설치 경로		/ 32-bit Program Files
;   %CommonProgramFiles%       	64비트 공용 라이브러리 경로	/ 64-bit Common Files
;   %CommonProgramFiles(x86)%  	32비트 공용 라이브러리 경로	/ 32-bit Common Files
;   %ProgramData%              	공용 프로그램 데이터			/ All users application data
;
;   %COMPUTERNAME%             	PC 네트워크 이름				/ Computer network name
;   %LOGONSERVER%              	로그인 인증 서버				/ Logon authentication server
;   %USERDOMAIN%               	사용자 도메인, 워크그룹		/ User domain or workgroup
;   %PROCESSOR_ARCHITECTURE%   	CPU 아키텍처					/ CPU architecture
;   %NUMBER_OF_PROCESSORS%     	논리 프로세서 개수			/ Number of logical processors
;
;   %PATH%                    	실행 파일 탐색 경로			/ Executable search path
;   %PATHEXT%                  	실행 가능 확장자 목록			/ Executable file extensions
;   %ComSpec%                  	명령 인터프리터 경로			/ Command interpreter path
;   %PUBLIC%                 	공용 사용자 폴더				/ Public user folder

[Launch]
; 런처 기본 실행 설정
; Basic launch settings
; ----------------------------------------------------------------------------------------

; 이전 실행 오류(크래시) 감지 및 자동 복구.
; Crash detection and auto-recovery from previous session.
; 1 = 수행 (기본값) : 시작 시 이전 세션이 남긴 호스트 흔적을 탐지하여 복원.
;     · 호스트 AppData : 잔여 _bakk 폴더를 탐지하여 복원.
;     · 호스트 레지스트리 : [Registry] / [RegistryShell] 의 백업(*.reg.bakk)을 되돌림.
;     Enable (default) : detects what the previous session left on the host and restores it.
;     · Host AppData : detects leftover _bakk folders and restores them.
;     · Host registry : rolls back the [Registry] / [RegistryShell] backups (*.reg.bakk).
; 0 = 통과 : 항상 동일 PC에서만 사용하는 경우 등, 호스트 오염을 감수하고 부하를 줄이려는 경우.
;     Skip : for single-PC use where host contamination is acceptable to reduce overhead.
; ※ 주의 : 0 설정 후 크래시 발생 시 호스트 AppData 와 레지스트리가 오염된 상태로 남을 수 있음.
;          (레지스트리는 호스트 원본 값이 다음 실행 때 삭제되어 되돌릴 수 없게 됨)
; ※ Cautions : If a crash occurs with this set to 0, host AppData and registry may remain contaminated.
;               (For the registry, the host's original values are discarded on the next launch and cannot be recovered.)
CrashRecovery=1

; 관리자 권한으로 실행 (1=사용, 0=미사용).
; Run as administrator (1=Enable, 0=Disable).
RunAsAdmin=0

; 런처 표시 이름 - 메시지 박스 제목 등에 사용됨.
; Launcher display name - used in message box titles, etc.
LauncherName=TargetApp MIIIME Launcher

; 내부 앱 식별 이름 - 임시 폴더명, 로그 식별 등에 사용됨.
; Internal app name - used for temp folder naming, log identification, etc.
AppName=TargetApp

; 실행 파일 (RunPath 폴더 기준 상대 경로, 확장자 .exe 필수). 하위 폴더 허용 (예: bin\TargetApp.exe).
; 절대 경로, 드라이브 · UNC 경로, ".." 는 허용되지 않음.
; Executable (path relative to RunPath, must end with .exe). Subfolders allowed (e.g. bin\TargetApp.exe).
; Absolute, drive and UNC paths and ".." are not allowed.
ExeName=TargetApp.exe
; ※ 32비트 / 64비트 겸용 패키지는 지원하지 않음. 런처를 비트별로 따로 빌드하여 포터블도 하나의 비트만 담는다.
;    x86 포터블 = x86 런처 / x64 포터블 = x64 런처. (x86 포터블은 32 · 64비트 OS 모두에서 실행됨, x64 포터블은 64비트 OS 전용)
;    런처와 타겟의 비트가 같아야 레지스트리(HKLM\SOFTWARE 의 32/64비트 뷰)와 System32 / SysWOW64 접근이 타겟이 보는 것과 일치함.
;    비트가 다르면 로그에 "Bitness mismatch" 경고가 남음 (실행은 막지 않음).
;    .NET AnyCPU 앱은 64비트 Windows 에서 64비트로 실행되는 것으로 판정함. 다른 비트의 프로세스를 띄우는 stub exe 는 감지할 수 없으므로 그 경우 경고는 무시해도 됨.
; ※ Separate x86 / x64 packages: build the launcher per bitness and wrap only one bitness of the app.
;    x86 portable = x86 launcher / x64 portable = x64 launcher. (An x86 portable runs on 32- and 64-bit Windows; an x64 portable needs 64-bit Windows.)
;    A launcher that matches the target's bitness sees the same registry views (HKLM\SOFTWARE 32/64-bit) and System32 / SysWOW64 as the target.
;    A mismatch is logged as "Bitness mismatch" (the launch is not blocked).
;    .NET AnyCPU apps are treated as 64-bit on 64-bit Windows. A stub exe that starts a process of the other bitness cannot be detected; ignore the warning in that case.

; 중복 실행 방지 뮤텍스 이름 (런처마다 고유값 권장).
; Mutex name for preventing duplicate instances (unique value recommended).
UniqueMutex=TargetApp_MIIIME_Mutex

; 다중 인스턴스 허용 여부 (1=허용, 0=차단).
; Allow multiple instances (1=Allow, 0=Block).
AllowMultipleInstances=1

; 호스트 설치 여부 간이 검사 (1=검사, 0=건너뜀).
; Simple check for host installation (1=Check, 0=Skip).
; 정밀 탐색이 아닌 빠른 힌트 목적. 오탐·누락이 있을 수 있음.
; This is a lightweight hint, not a precise scan. False positives/negatives may occur.
HostInstallCheck=0

; 작업 디렉토리 (비워두면 RunPath 사용, 매크로 사용 가능).
; Working directory (defaults to RunPath if empty, macros supported).
WorkDir=

[Directories]
; 런처 핵심 폴더 경로 (상대 경로 권장)
; Core folder paths (relative paths recommended)
; ----------------------------------------------------------------------------------------

; 타겟 앱 실행 파일 위치.
; Path to target app executable.
RunPath=App\TargetApp

; 데이터 초기화용 원본 템플릿 경로.
; Default data template path.
RawDataPath=App\RawDat

; 추가 파일 루트 경로 (Ast, Env, Res 하위 폴더의 기준).
; Extra files root path (parent of Ast, Env, Res subfolders).
ExtPath=App\Ext

; 사용자의 실제 사용 데이터가 저장되는 경로.
; Path where user data is actively stored and modified.
DataPath=Dat

[Environment]
; 환경변수 (예약 키)
; Environment variables (Reserved Keys)
; ----------------------------------------------------------------------------------------

; {CommonFiles} 매크로의 실제 경로를 변경할 때만 지정 (기본값 : ..\CommonFiles).
; Only specify to override the {CommonFiles} macro path (default : ..\CommonFiles).
CommonFilesDir=D:\MySharedLibs

; {_MIIIMEEnv} 매크로의 실제 경로를 변경할 때만 지정 (기본값 : ..\_MIIIMEEnv).
; Only specify to override the {_MIIIMEEnv} macro path (default : ..\_MIIIMEEnv).
_MIIIMEEnvDir=D:\MyMIIIMEEnv

; 특정 프로그램의 홈 경로 / Home path of a specific program.
TargetApp_HOME={Run}
; TargetApp 사용자 설정 저장 경로 / Path where TargetApp user settings are saved.
TargetApp_USERHOME={Run}

; ※ 주의 : PATH= (단일 키) 형식은 무시됨. PATH 추가는 반드시 PATH01=, PATH02= 번호 형식을 사용.
; ※ Caution : A plain PATH= key is ignored. Use numbered keys (PATH01=, PATH02=, ...) to add to the PATH variable.

; ======================================================================
; PATH 설정 방법 / How to Set PATH
; ======================================================================

; 유형 1 : PATH 확장 / Type 1 : PATH Extension.
PATH01={System32}
PATH02={SysWOW64}
PATH03={Base}\..\_MIIIMEEnv\System32
PATH04={Base}\..\_MIIIMEEnv\SysWOW64
PATH05={CommonFiles}\Git\cmd
PATH06={CommonFiles}\Python
PATH07={CommonFiles}\Node.js

PATH08={Env}\System32
PATH09={Env}\SysWOW64

; 유형 2 : 런타임 라이브러리 / Type 2 : Runtime Library.
JAVA_HOME={CommonFiles}\Java64
_JAVA_OPTIONS="-Dfile.encoding=UTF-8"
GS_LIB={CommonFiles}\Ghostscript\lib
GS_DLL={CommonFiles}\Ghostscript\bin\gsdll64.dll

; 유형 3 : 포터블 가상 변수 / Type 3 : Portable Virtual Variables.
MY_APP_ROOT={Run}
MY_TEMP_DIR={Local}\Temp\MyApp

; 유형 4 : 포터블 도구 홈 경로 / Type 4 : Portable Tool Home Paths.
HOME={Dat}\Git\home
PYTHONUSERBASE={Dat}\Python
NPM_CONFIG_PREFIX={Dat}\Node.js\npm
NPM_CONFIG_CACHE={Dat}\Node.js\npm-cache

; 유형 5 : 시스템 재정의 / Type 5 : System Override.
LANG=ko_KR.UTF-8
TMP={Local}\Temp
TEMP={Local}\Temp

[Options]
; 런처 동작 옵션
; Launcher behavior options
; ----------------------------------------------------------------------------------------

; AppData 주입 방식 선택 / AppData injection mode.
; 1 = Junction 모드 : NTFS 심볼릭 링크로 AppData 연결.
;     Junction mode : Links AppData via NTFS symlink.
; 0 = Swap 모드 : AppData 폴더를 물리적으로 이동/복사 (비 NTFS 드라이브 또는 FreezeMode 사용 시).
;     Swap mode : Physically moves/copies AppData (For non-NTFS drives or with FreezeMode).
UseJunction=1

; 동결 모드 - 종료 시 데이터 저장 안 함 / Freeze mode - no data saved on exit.
; 1 = 종료 시 모든 변경사항 폐기.
;     All changes discarded on exit.
; 0 = 일반 모드. 변경사항을 Dat 폴더에 저장.
;     Normal mode. Changes saved to Dat folder.
; ※ 참고 : FreezeMode=1 은 UseJunction=0 (Swap 모드)에서만 작동함.
; ※ Note : FreezeMode=1 only works with UseJunction=0 (Swap mode).
FreezeMode=0

; 읽기전용 매체 감지 / Read-only media detection.
; 1 = 수행 : 읽기전용 매체로 감지되면 안내 메시지 후 종료.
;     Enable : shows message and exits if read-only media is detected.
; 0 = 통과 : USB/HDD 전용 환경에서 불필요한 부하를 줄이려는 경우.
;     Skip : reduces overhead for USB/HDD-only deployments.
; ※ 주의 : 읽기전용 매체에서 실행하면 감지 없이 그대로 오류 발생 (사용자 감수).
; ※ Cautions : Running on read-only media will cause errors without warning (user accepts risk).
DetectReadOnly=0

; 로그 레벨 / Log level.
; 0 = 꺼짐 (기본값) ? ERROR 포함 모든 로그 비활성. / Disabled ? no logging at all (default).
;     / Off (default) ? All logging disabled including ERROR. Set to 1+ for diagnostics.
; 1 = 전체 기록 (DEBUG 포함) / Log everything including DEBUG  [--debug 플래그와 동일]
; 2 = INFO 이상 기록 / Log INFO, WARN, ERROR (excludes DEBUG)
; 3 = WARN 이상 기록 / Log WARN and ERROR only
; 4 = ERROR 만 기록 / Log ERROR only
;
; ※ 숫자가 클수록 필터가 강해짐. 범위 외 값(5+)은 0으로 처리.
; ※ Higher value = stricter filter. Values outside 0-4 are treated as 0.
LogLevel=0

; 추가 명령 / Additional command.
; 모든 인수를 한 줄에 공백으로 이어서 작성.
; Combine all arguments into a single line separated by spaces.
; 예시 : 프로필 경로를 Dat 폴더로 지정.
; Example : Set the profile path to the Dat folder.
AddCommand=-profile "{Dat}\profile"

[ProcessWatch]
; 타겟 앱(ExeName) 외에 추가로 종료를 감시할 프로세스
; Additional processes to monitor for exit, besides the main app(ExeName)
; ----------------------------------------------------------------------------------------

; 등록된 모든 프로세스가 종료된 후 최종 정리 시작.
; Cleanup starts only after ALL registered processes have terminated.
; 런처는 자식 프로세스를 자동 추적하지 않으므로, 별도로 실행되는 프로세스는 반드시 등록.
; The launcher does not auto-track child processes. Register any separately spawned processes here.
01=updater.exe
02=crashpad_handler.exe

[ProcessKill]
; 타겟 앱 종료 후 잔류 헬퍼 프로세스 강제 종료
; Forcefully terminates helper processes that remain after the target app exits
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 항목은 RunPath 기준 상대 경로의 .exe 만 허용됨 (예: updater.exe, bin\updater.exe). 절대 경로와 ".." 는 거부됨.
; 실행 중인 프로세스의 실제 경로가 RunPath\항목 과 일치할 때만 종료함. 경로가 다르거나 확인할 수 없으면 로그만 남기고 종료하지 않음.
; 실행 중이 아니면 조용히 건너뜀.
; 시스템 핵심 프로세스(explorer, winlogon, csrss, lsass, services, svchost, smss, wininit, dwm)와 이 런처 자신은 종료 대상에서 제외됨.
; Only .exe paths relative to RunPath are accepted (e.g. updater.exe, bin\updater.exe). Absolute paths and ".." are rejected.
; A process is terminated only when its actual path equals RunPath\<entry>. If the path differs or cannot be read,
; only a log entry is written. Processes that are not running are skipped silently.
; Core system processes (explorer, winlogon, csrss, lsass, services, svchost, smss, wininit, dwm) and this launcher itself are never terminated.

; 동작 순서 / Operation sequence:
; 1) ProcessClose(PID) 로 종료 요청 / Request termination via ProcessClose(PID).
; 2) 500ms 대기 / Wait 500ms.
; 3) 아직 실행 중이면 taskkill /F /PID 로 강제 종료 / Force-kill via taskkill /F /PID if still running.

; 형식 : RunPath 기준 상대 경로 (exe)
; Format : Path relative to RunPath (exe)
01=updater.exe
02=bin\helper.exe

[Registry]
; 레지스트리 제어
; Registry control
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 이 섹션(및 RegistryRoot / RegistryShell / RegistryFix)의 레지스트리 경로는 다음 기본 규칙으로 검사되며,
; 위반 항목은 로그에 기록되고 건너뜀.
; Registry paths in this section (and RegistryRoot / RegistryShell / RegistryFix) are checked by the rules below;
; violating entries are logged and skipped.
;   - HKLM / HKCU 만 허용 / Only HKLM and HKCU.
;   - HKLM 의 SYSTEM, SAM, SECURITY, HARDWARE, BCD00000000 은 항상 차단 / Always blocked (cannot be relaxed).
;   - 허용 범위 / Allowed : HKCU\SOFTWARE , HKLM\SOFTWARE
;   - 차단 (위 범위 안이라도) / Blocked inside it : Run, RunOnce, RunServices, Policies, Winlogon,
;     Image File Execution Options, Windows Defender, 실행 파일 연결(exe/bat/cmd/com/scr/lnk 등)의 shell\open 및 해당 확장자 키.
;   - 키 자체(HKLM\SOFTWARE 등 최상위 컨테이너)를 통째로 대상으로 하는 것은 차단 / Top-level container keys cannot be targeted as a whole.
;   - .reg 파일에 [-키] (키 삭제) 구문이 있으면 파일 전체를 거부 / A .reg file containing [-key] deletions is rejected entirely.

; 실행 시 - 호스트 레지스트리 키 백업 후 포터블 .reg 파일 주입.
; On launch - backup host registry key, inject portable .reg file.
; 종료 시 - 변경사항 내보내기 후 삭제, 호스트 값 복원.
; On exit - export changes, delete key, restore host value.

; SmartSkip=0 : 항상 실행 / Always run.
; SmartSkip=1 : 경로 · 호스트 변경 감지 시에만 실행 / Run only when env change detected.
; SmartSkip=2 : 항상 통과 / Always skip.
SmartSkip=0

; ── 항목 형식 / Entry Format ──
;
; 형식 1 : 레지스트리 키 전체 경로
; Format 1 : Full registry key path

; 예시 : 앱 전용 키 (키 트리 전체 제어).
; Example : App-specific key (full key tree control).
01=HKEY_CURRENT_USER\SOFTWARE\VendorName\TargetApp

; 형식 2 : 키경로|값명 (값 단위 삭제 모드)
; Format 2 : KeyPath|ValueName (Value-only delete mode)

; 예시 : 공유 키에서 특정 값만 제어 (값 단위 모드).
; Example : Control only a specific value in a shared key (value-only mode).
02=HKEY_LOCAL_MACHINE\SOFTWARE\RegisteredApplications|TargetApp

; ※ 백업, 삭제, 복원은 SmartSkip 여부와 무관하게 항상 실행 / Backup, delete, restore always run regardless of SmartSkip.
; ※ Dat\Reg 가 없으면 포터블 .reg의 주입 회수를 건너뜀 (흔적 제거 전용) / Skip injection of portable .reg if Dat\Reg is not present (Trace removal only).

; ※ HKLM\SOFTWARE 항목은 런처와 같은 비트의 레지스트리 뷰에 적용됨 (x86 런처 = WOW6432Node 뷰, x64 런처 = 64비트 뷰).
;    "HKLM64\..." 같은 64 접미사 약칭은 지원하지 않음 (BLOCKED).
; ※ HKLM\SOFTWARE entries are applied to the registry view of the launcher's own bitness (x86 launcher = WOW6432Node view, x64 launcher = 64-bit view).
;    "64"-suffixed roots such as "HKLM64\..." are not supported (BLOCKED).

; ※ 64비트 Windows 에서 32비트 앱이 HKLM\SOFTWARE\WOW6432Node\... 에 만드는 키도 INI 와 .reg 에는
;    HKEY_LOCAL_MACHINE\SOFTWARE\... 로 적음. (WOW6432Node 를 직접 쓰지 않음)
;    x86 런처가 자동으로 WOW6432Node 쪽에 적용 · 회수하고, x64 런처는 64비트 쪽에 적용함. 따라서 32비트 앱은 x86 런처로 래핑할 것.
;    regedit(64비트)에서 본 WOW6432Node 경로를 .reg 에 직접 옮길 때는 SOFTWARE\ 바로 뒤의 WOW6432Node\ 를 지울 것.
;    HKEY_CURRENT_USER\SOFTWARE 는 32 / 64비트가 공유하므로 WOW6432Node 가 없음.
; ※ A 32-bit app's keys under HKLM\SOFTWARE\WOW6432Node\... on 64-bit Windows are also written as HKEY_LOCAL_MACHINE\SOFTWARE\... in the INI and in .reg files
;    (do not write WOW6432Node yourself). The x86 launcher applies and retrieves them in the WOW6432Node view automatically; the x64 launcher uses the 64-bit view.
;    So wrap 32-bit apps with the x86 launcher. When copying a WOW6432Node path seen in 64-bit regedit into a .reg file, delete the "WOW6432Node\" right after "SOFTWARE\".
;    HKEY_CURRENT_USER\SOFTWARE is shared by 32- and 64-bit apps and has no WOW6432Node.

; ── 크래시 복구 / Crash Recovery ──
; 강제 종료 · 전원 차단 · 로그오프 등으로 종료 루틴이 실행되지 못하면, 호스트 키에 포터블 값이 남고 원본은 백업 파일(*.reg.bakk)에만 있음.
; 다음 실행 시 [Launch] CrashRecovery=1 이면 이를 자동으로 되돌림 (Dat\Reg 내보내기 → 삭제 → 호스트 백업 복원, 정상 종료와 같은 순서).
; If the exit routine never ran (forced kill, power loss, logoff...), the host key keeps the portable values and the original exists only in *.reg.bakk.
; On the next launch with [Launch] CrashRecovery=1 this is rolled back automatically (export to Dat\Reg -> delete -> restore host backup, same order as a normal exit).
;   - 이전 세션의 런처 또는 타겟 앱이 아직 실행 중이면 복구하지 않음 / Not recovered while the previous launcher or target app is still running.
;   - 복구 대상은 현재 INI 에 있는 항목뿐. 지금 INI 에서 지운 항목은 삭제 없이 백업만 복원 / Only entries still in the current INI are deleted; removed entries get a backup restore only.
;   - HKLM 항목은 관리자 권한일 때만 복구하며, 아니면 다음 관리자 실행으로 미룸 / HKLM entries are recovered only with administrator rights, otherwise deferred to the next elevated run.
;   - 백업은 이 PC 의 임시 폴더(%TEMP%)에 있으므로 같은 PC 에서 다시 실행할 때만 복구됨 / Backups live in this PC's %TEMP%, so recovery happens only when relaunched on the same PC.
;   - 임시 폴더를 직접 지우면 복구할 수 없음 / Deleting the temp folder by hand makes recovery impossible.
;   - [RegistryFix] (백업 없음) 와 [RegistryTrace] (삭제 전용) 는 복구 대상이 아님 / [RegistryFix] (no backup) and [RegistryTrace] (delete-only) are not recovered.
;   - 여러 인스턴스(AllowMultipleInstances=1)가 같은 키를 동시에 주입하는 구성은 권장하지 않음 / Injecting the same key from several instances at once (AllowMultipleInstances=1) is not recommended.

[RegistryRoot]
; 상위 레지스트리 제어
; Root registry control
; ----------------------------------------------------------------------------------------

; 종료 정리 시, 지정한 상위 키가 완전히 비어있을 경우에만 삭제.
; On exit, deletes the specified parent key ONLY if it is completely empty.

SmartSkip=0

01=HKEY_CURRENT_USER\SOFTWARE\VendorName

[RegistryShell]
; Windows 우클릭 메뉴에 항목을 등록
; Registers items in the Windows right-click context menu
; ----------------------------------------------------------------------------------------

; 실행 시 등록, 종료 시 자동 해제. 기존 값이 있으면 백업 후 복원.
; Registered on launch, removed on exit. Existing values are backed up and restored.
; 비정상 종료 시에도 다음 실행에서 [Launch] CrashRecovery=1 이면 해제 + 백업 복원이 이어서 수행됨 ([Registry] 의 크래시 복구 참조).
; After an abnormal exit, the next launch with [Launch] CrashRecovery=1 finishes the removal and backup restore (see Crash Recovery under [Registry]).

SmartSkip=0

; 형식 : 대상|ID|메뉴 텍스트|명령어[|아이콘 경로]'
; Format : Target|ID|MenuText|Command[|IconPath]'

; 예시 : 폴더 우클릭 → TargetApp으로 열기.
; Example : Folder right-click → Open with TargetApp.
01=Directory|TargetApp_Open|Open with TargetApp|"{Exe}" "%1"|"{Exe}"

; 예시 : .mxe 확장자 우클릭 → TargetApp으로 편집.
; Example : .mxe file right-click → Edit with TargetApp.
02=.mxe|TargetApp_Edit|Edit with TargetApp|"{Exe}" -edit "%1"

[RegistryFix]
; 레지스트리 값 수정
; Forcefully overrides registry values
; ----------------------------------------------------------------------------------------

SmartSkip=1

; 형식 : 레지스트리 키 경로|값 이름|새 데이터[|값 형식]
; Format : KeyPath|ValueName|Value[|ValueType]
; ※ 백업 · 복원이 없는 강제 덮어쓰기이므로 크래시 복구 대상이 아님 / Forced overwrite without backup/restore, so it is not covered by crash recovery.
; ValueName : 비워두면 '(기본값)'에 기록됨 / Empty = writes to '(Default)'
; ValueType : [선택] REG_SZ(기본값), REG_DWORD, REG_EXPAND_SZ 등.
;             [Optional] REG_SZ (default), REG_DWORD, REG_EXPAND_SZ, etc.

; ======================================================================
; 지원 와일드카드 / Supported wildcards
; ======================================================================
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
;
; ServiceName~  → ServiceName 으로 시작하는 임의 키 (예: ServiceName143.0.0.13).
; ~ServiceName  → ServiceName 으로 끝나는 임의 키.
; Service~Name  → Service 와 Name 사이에 임의 문자열이 있는 키.
; ~             → 하위 키 중 첫 번째 (임의 키).
; ServiceName^^^.^.^.^^ → ServiceName143.0.0.13 처럼 숫자의 갯수가 일치하는 키.
;
; 여러 개 일치 시 열거 순서상 첫 번째 키를 사용.
; When multiple keys match, the first one in enumeration order is used.
; 경로 내 ~ 가 여러 개이면 순차적으로 해석.
; Multiple ~ in the same path are resolved sequentially.

; 예시 : 버전 번호가 달라지는 키 경로 처리.
; Example : Handle key path with changing version number.
01=HKEY_LOCAL_MACHINE\SOFTWARE\VendorName\Updater~|ImagePath|{Run}\updater.exe

; 예시 : 설치 경로를 현재 RunPath로 강제 고정.
; Example : Force-set install path to current RunPath.
02=HKEY_CURRENT_USER\Software\VendorName\TargetApp|InstallPath|{Run}

; 예시 : 자동 업데이트 비활성화 (DWORD).
; Example : Disable auto-update (DWORD).
03=HKEY_CURRENT_USER\Software\VendorName\TargetApp|AutoUpdate|0|REG_DWORD

; 예시 : 프로토콜 핸들러 기본값 등록 (값 이름 없음 = 기본값).
; Example : Register protocol handler default value (empty name = Default).
04=HKEY_CURRENT_USER\Software\Classes\myapp||MIIIME Launcher Protocol

[RegistryTrace]
; 실행 흔적(셸 캐시/MRU/UserAssist) 레지스트리 값 삭제 -- 백업/복원 없는 편도(one-way) 삭제 전용
; Deletes shell-cache/MRU/UserAssist registry VALUES that record "this exe was run" -- one-way delete, no backup/restore
; ----------------------------------------------------------------------------------------

; [Registry] 섹션과 차이점:
; Difference from [Registry] section:
;   - [Registry]      : 앱 설정값을 백업 → 주입 → (사용) → 내보내기 → 삭제 → 호스트 값 복원 (왕복)
;   - [Registry]      : Backs up app settings → injects → (use) → exports → deletes → restores host value (round-trip)
;   - [RegistryTrace] : "실행했다"는 흔적 값만 지움. 복원할 호스트 값이 없으므로 백업하지 않음 (편도)
;   - [RegistryTrace] : Only deletes "this was executed" trace values. Nothing to restore, so no backup (one-way)

; 실행 시점 : 타겟 프로세스가 완전히 종료되고, 다른 모든 정리 작업(레지스트리 회수, 파일 정리,
;            UserFile/AppData 복원 등)이 끝난 뒤, 종료 루틴의 맨 마지막에 실행됨.
; Timing    : Runs at the very end of the exit routine, after the target process has fully
;            terminated and every other cleanup step (registry retrieve, file cleanup,
;            UserFile/AppData restore, etc.) has completed.

; SmartSkip=0 : 항상 실행 / Always run.
; SmartSkip=1 : 경로 · 호스트 변경 감지 시에만 실행 / Run only when env change detected.
; SmartSkip=2 : 항상 스킵 (기본값) / Always skip (default).
; ※ 다른 Registry* 섹션과 달리 기본값이 2(비활성)임. 흔적 삭제는 사용자가 의도를
;    명확히 가질 때만 켜지도록 설계되었음.
; ※ Unlike the other Registry* sections, the default here is 2 (disabled). Trace cleanup
;    is opt-in by design, only enabled once you've made a deliberate choice.
SmartSkip=2

; ── 내장 안전장치 / Built-in Safety Guard ──
; RegistryTrace 는 복원 수단이 없는 편도 삭제이므로 다음 기본 규칙이 적용됨.
; RegistryTrace is a one-way delete with no restore, so these default rules apply.
;   - HKCU 만 허용 (HKLM / HKCR / HKU 는 모두 차단) / HKCU only (HKLM / HKCR / HKU are blocked).
;   - 허용 범위 / Allowed : 셸 기록 캐시 계열(MUICache, BagMRU, ComDlg32, UserAssist, RunMRU 등 내장 목록).
;     Shell history caches (MUICache, BagMRU, ComDlg32, UserAssist, RunMRU, etc. from the built-in list).
;   - 모든 프로그램이 공유하는 셸 캐시 키는 트리(키 전체) 삭제가 차단됨. 반드시 "키경로|값명" 형식으로 값 하나만 지정할 것.
;     Shared shell-cache keys cannot be tree-deleted. Always use "KeyPath|ValueName" to target one value.

; ── 항목 형식 / Entry Format ──
;
; 키경로|값명   (값 하나만 지정 -- 반드시 이 형식 사용 / Key|ValueName -- always use this form)
; 키경로        (구분자 "|" 없음 → 키 트리 전체 삭제. 공유되지 않는 "전용" 키에서만 사용)
;              (No "|" separator → deletes the ENTIRE key tree. Only use on keys NOT shared with other apps)
;
; {Exe}, {Launcher} 등 매크로를 값명 위치에 사용할 수 있음.
; Macros such as {Exe}, {Launcher} can be used in the value-name position.
;   {Exe}      = 타겟 앱 실행 파일 전체 경로 (App\...\TargetApp.exe)
;              = Full path to the target app executable
;   {Launcher} = 이 런처(TargetApp_M.exe) 자신의 전체 경로
;              = Full path to this launcher executable itself

; ※ 경고 / WARNING
; 아래 키들(MUICache, BagMRU, ComDlg32 MRU, UserAssist)은 Windows 셸이 "모든 프로그램"에
; 공용으로 사용하는 키임. 반드시 "키경로|값명" 형식으로 우리 앱의 값 하나만 지정할 것.
; 가장 상위 키("|" 없이)를 그대로 적어 넣으면 다른 프로그램의 실행 기록까지 통째로 삭제되므로
; 절대 금지임.
; The keys below (MUICache, BagMRU, ComDlg32 MRU, UserAssist) are SHARED by the Windows shell
; across every program on the system. Always target exactly one value with "KeyPath|ValueName".
; Never write the bare parent key (without "|") here -- doing so would wipe other programs'
; execution history too.

; 예시 : MuiCache -- 탐색기가 exe의 "표시 이름"과 "제작사"를 캐싱하는 영역. 가장 흔히 쓰이는 흔적 키.
; Example : MuiCache -- where Explorer caches an exe's "friendly name" and "company". The most common trace key.
;
; ※ Windows 7 이후(Win10/11 포함)는 값 이름이 "exe 경로 + 접미사" 형태로 저장됨.
;    접미사 두 가지 : .FriendlyAppName / .ApplicationCompany  → 둘 다 지정해야 완전히 제거됨.
; ※ Since Windows 7 (incl. Win10/11), value names are stored as "exe path + suffix".
;    Two suffixes exist : .FriendlyAppName / .ApplicationCompany  → list both to remove it completely.
01=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Exe}.FriendlyAppName
02=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Exe}.ApplicationCompany
03=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Launcher}.FriendlyAppName
04=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Launcher}.ApplicationCompany
;
; 구형 Windows(XP 등) : 값 이름이 경로 그대로이며 접미사 없음. 해당 값이 없으면 조용히 스킵됨.
; Legacy Windows (XP, etc.) : value name is the bare path, no suffix. Silently skipped if absent.
05=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\ShellNoRoam\MUICache|{Exe}
06=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\ShellNoRoam\MUICache|{Launcher}
;
; 보조 exe (ProcessWatch / ProcessKill 에 등록한 updater 등)도 흔적이 남음. {Run} 매크로로 지정할 것.
; Helper exes (e.g. updater registered in ProcessWatch / ProcessKill) also leave traces. Use the {Run} macro.
;07=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Run}\updater.exe.FriendlyAppName
;08=HKEY_CURRENT_USER\SOFTWARE\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache|{Run}\updater.exe.ApplicationCompany

; 예시 : UserAssist -- 탐색기가 실행 횟수·마지막 실행 시각을 기록하는 영역.
; Example : UserAssist -- where Explorer records run count and last-run time.
;
; ※ UserAssist 의 값 이름은 경로를 ROT13 으로 인코딩하여 저장하므로 {Exe} 를 그대로
;    쓰면 매칭되지 않음. {ExeROT13} / {LauncherROT13} 매크로를 사용할 것.
; ※ UserAssist value names are ROT13-encoded paths -- {Exe} will not match.
;    Use the {ExeROT13} / {LauncherROT13} macros instead.
;
; ※ UserAssist 하위에 여러 GUID 서브키가 있으며 각각 독립된 값 목록을 가짐.
;    ~ 와일드카드는 열거 순서 첫 번째 GUID 만 해석함.
;    모든 GUID 를 대상으로 하려면 알려진 GUID 를 각각 별도 항목으로 기재할 것.
; ※ UserAssist has multiple GUID subkeys, each with its own value list.
;    The ~ wildcard resolves only the first GUID in enumeration order.
;    To cover all GUIDs, list each known GUID as a separate entry.
;
; 잘 알려진 GUID (Windows 10/11 기준) / Well-known GUIDs (Windows 10/11):
;   {CEBFF5CD-ACE2-4F4F-9178-9926F41749EA}  Application Executables
;   {F4E57C4B-2036-45F0-A9AB-443BCFE33D9F}  Shortcut Execution
;   {CAA59E3C-4792-41A5-9909-6A6A8D32490E}  Shortcut Execution (older)
;
; 방법 A : 알려진 GUID 를 모두 명시 (권장) / Method A: list all known GUIDs (recommended)
09=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{CEBFF5CD-ACE2-4F4F-9178-9926F41749EA}\Count|{ExeROT13}
10=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{F4E57C4B-2036-45F0-A9AB-443BCFE33D9F}\Count|{ExeROT13}
11=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{CEBFF5CD-ACE2-4F4F-9178-9926F41749EA}\Count|{LauncherROT13}
12=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{F4E57C4B-2036-45F0-A9AB-443BCFE33D9F}\Count|{LauncherROT13}
; 구버전 GUID : 해당 GUID 가 없으면 조용히 스킵됨.
; Older GUID : silently skipped if that GUID does not exist.
13=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{CAA59E3C-4792-41A5-9909-6A6A8D32490E}\Count|{ExeROT13}
14=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\{CAA59E3C-4792-41A5-9909-6A6A8D32490E}\Count|{LauncherROT13}
;
; 방법 B : 와일드카드로 첫 번째 GUID 만 대상 / Method B: wildcard to target the first GUID only
;09=HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\~\Count|{ExeROT13}
;
; ※ 한계 / Limitations
;   - 바로가기(.lnk)로 실행하면 값 이름이 .lnk 경로의 ROT13 이므로 {ExeROT13} 와 일치하지 않음.
;     Launching via a shortcut (.lnk) stores the ROT13 of the .lnk path, which {ExeROT13} does not match.
;   - 런처가 바탕화면·문서·다운로드 등 "알려진 폴더" 아래에 있으면 경로 앞부분이 폴더 GUID 로
;     치환되어 저장될 수 있어 일치하지 않음. (USB / 일반 드라이브 경로는 해당 없음)
;     If the launcher sits under a "known folder" (Desktop, Documents, Downloads...), the path prefix may be
;     stored as a folder GUID and will not match. (Not an issue for USB / ordinary drive paths.)
;
; ※ 미지원 : BagMRU, ComDlg32 의 LastVisitedPidlMRU / OpenSavePidlMRU 는 값 이름이 숫자(0, 1, MRUListEx)
;    이고 경로는 값 "데이터"(바이너리 PIDL) 안에 있으므로 "키경로|{Exe}" 형식으로 지정할 수 없음.
;    (지정해도 매칭되지 않고 항상 "not found" 로 스킵됨.)
; ※ Not supported : For BagMRU and ComDlg32 LastVisitedPidlMRU / OpenSavePidlMRU, value names are numeric
;    (0, 1, MRUListEx) and the path lives in the value DATA (binary PIDL), so "KeyPath|{Exe}" cannot target it.
;    (It will never match and is always skipped as "not found".)

; 관련 타이밍 설정은 [Advanced]의 TraceCleanWait / TraceCleanIdleWait / TraceCleanPollMs /
; TraceCleanStepDelay 를 참고할 것.
; See TraceCleanWait / TraceCleanIdleWait / TraceCleanPollMs / TraceCleanStepDelay in
; [Advanced] for related timing options.

[FileWrite]
; 지정한 파일의 내용을 수정
; Modifies the contents of specified files
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 수정 가능한 파일은 기본적으로 {Dat} / {Run} / {Local} / {Roaming} / {LocalLow} 아래로 제한됨.
; 그 밖에 런처 폴더 자체, 런처 exe / ini / 로그, 사용자 프로필·Windows·ProgramFiles 등의 루트와 System32\config 는 항상 차단됨.
; By default only files under {Dat} / {Run} / {Local} / {Roaming} / {LocalLow} can be modified.
; The launcher folder itself, the launcher exe / ini / log, the roots of UserProfile / Windows / ProgramFiles
; and System32\config are always blocked.

SmartSkip=1

; ======================================================================
; 지원 와일드카드 (파일 경로에 사용 가능) / Supported wildcards (in file path)
; ======================================================================
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
;
; ※ 와일드카드는 파일 경로의 파일명(마지막 세그먼트)에만 사용할 것. 부모 폴더 경로는 실제 경로여야 함.
; ※ Use wildcards only in the filename (last segment) of the file path. The parent folder path must be a real path.

; 예시 : 버전 번호가 달라지는 설정 파일 처리.
; Example : Handle config file with changing version number.
01={Dat}\profile\prefs~.js|FindStr|ReplaceStr

; ======================================================================
; 유형 A : 텍스트 직접 치환, 없으면 추가 / Type A : Replace or Append.
; 형식 : 파일경로|찾을문자열|바꿀문자열
; Format : FilePath|FindString|ReplaceString

; 예시 : XML 파일의 하드코딩된 경로를 현재 실행 경로로 치환.
; Example : Replace hardcoded path in XML file with current run path.
01={Run}\Config.xml|<WorkDir>C:\OldPath</WorkDir>|<WorkDir>{Run}</WorkDir>

; ── 유형 A-R : 정규식 치환 / Type A-R : Regex Replace. ──
; 형식 : 파일경로|R:정규식패턴|바꿀문자열
; Format : FilePath|R:RegexPattern|ReplaceString
; 찾을 문자열이 "R:"로 시작하면 StringRegExpReplace를 사용.
; If FindString starts with "R:", StringRegExpReplace is used.
; 패턴 불일치 시 Append를 수행하지 않고 DEBUG 로그만 남김.
; On pattern mismatch, no Append is performed ? DEBUG log only.
; ※ 정규식이 잘못된 경우 WARN 로그 후 해당 항목의 파일 쓰기를 중단함.
; ※ If the regex is invalid, a WARN is logged and the write is aborted for that entry.

; 예시 : <LastCheck>숫자</LastCheck> 줄을 통째로 제거.
; Example : Remove the entire <LastCheck>number</LastCheck> line.
01={Run}\Config.xml|R:<LastCheck>\d+</LastCheck>(\r?\n)?|

; ======================================================================
; 유형 B : INI 섹션 + 키 직접 수정 / Type B : Direct INI Section + Key Modification.
; 형식 : 파일경로|Section:섹션|Key:키|새값 (현재 값과 동일하면 쓰기를 건너뜀 - 멱등성 보장).
; Format : FilePath|Section:Section|Key:Key|NewValue (Skips write if value is already current - idempotent).

; 예시 : 앱 설정 파일의 저장 경로를 Dat 폴더로 업데이트.
; Example : Update save path in app config to Dat folder.
01={Run}\settings.ini|Section:Main|Key:SavePath|{Dat}\Saves

; ======================================================================
; 유형 C: 키 자동 감지 교체 / Type C: Auto-Detect Key Replace.
; 형식 : 파일경로|Key:키이름|새값 (JS, JSON 형식 감지 시 역슬래시를 자동으로 이중화).
; Format : FilePath|Key:KeyName|NewValue (Automatically doubles backslashes when detecting JS and JSON formats).

; 예시 : Notepad4.ini의 DefaultDirectory를 현재 실행 경로로 교체.
; Example : Auto-replace DefaultDirectory in Notepad4.ini with current run path.
01={Run}\Notepad4.ini|Key:DefaultDirectory|{Run}

; ※ 주의 : 같은 키가 여러 섹션에 있으면 모두 교체됨. 특정 섹션만 수정하려면 유형 B를 사용.
; ※ Cautions : All occurrences are replaced if the same key exists in multiple sections. Use Type B for section-specific modification.

[CleanupExclude]
; 지정 항목 제외(보존) 클린업
; Cleanup excluding(Keep) items
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 삭제·보존 정리 대상 경로는 다음 기본 규칙으로 검사되며, 위반 항목은 로그에 기록되고 건너뜀.
; Cleanup paths are checked by the default rules below; violating entries are logged and skipped.
;   - 로컬 절대 경로만 허용 (런처 폴더와 같은 UNC 공유 포함) / Local absolute paths only (plus UNC share of the launcher folder).
;   - 드라이브 루트, 런처 폴더와 그 상위 폴더, 런처 exe / ini / 로그는 항상 차단 / Always blocked.
;   - 기본 차단 / Blocked by default : Documents, Desktop, Downloads, Pictures, Music, Videos, Favorites, Links,
;     Saved Games, Searches, OneDrive, Dropbox, Google Drive, Microsoft, Windows, Packages, Boot, PerfLogs, ProgramFiles, ProgramFiles(x86).
;   - 따라서 {Desktop}\*.lnk 같은 바탕화면 바로가기 삭제는 기본적으로 차단됨.
;     Therefore deleting desktop shortcuts such as {Desktop}\*.lnk is blocked by default.

; ※ 주의 : 런처 외부 경로를 조작할 경우 호스트 시스템에 영구적인 변경이 가해질 수 있음.
; ※ Cautions : Manipulating paths outside the launcher may cause permanent changes to the host system.

; MIIIME Universal Cleaner (MUC)와 연동하여 사용가능 (SmartSkip=2 : 항상 통과후 필요시 MUC로 삭제).
; Can be used in conjunction with MIIIME Universal Cleaner (MUC) (SmartSkip=2: Always skip and delete with MUC if necessary).

SmartSkip=2

; 형식 : 경로\삭제할 항목 (와일드카드 지원).
; Format : Path\DeleteItem (Wildcards supported).

; ======================================================================
; 지원 와일드카드 (파일 경로에 사용 가능) / Supported wildcards (in file path)
; ======================================================================
; [FileWrite] 와 동일 / Same as [FileWrite]
;
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).
;
; ※ 와일드카드는 파일 경로의 파일명(마지막 세그먼트)에만 사용할 것. 부모 폴더 경로는 실제 경로여야 함.
; ※ Use wildcards only in the filename (last segment) of the file path. The parent folder path must be a real path.

; 예시 : 16자리 임의 문자 파일명의 .json 보존.
; Example : .json with 16-character random character file name is kept.
01={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json

; 예시 : 폴더 하나를 통째로 보존.
; Example : Keep an entire folder.
02={Dat}\Profile

[CleanupDelete]
; 지정 항목 클린업
; Cleanup items
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; [CleanupExclude] 와 동일한 기본 규칙이 적용됨. 위반 항목은 로그에 기록되고 건너뜀.
; The same default rules as [CleanupExclude] apply. Violating entries are logged and skipped.

; ※ 주의 : 런처 외부 경로를 조작할 경우 호스트 시스템에 영구적인 변경이 가해질 수 있음.
; ※ Cautions : Manipulating paths outside the launcher may cause permanent changes to the host system.

; MIIIME Universal Cleaner (MUC)와 연동하여 사용가능 (SmartSkip=2 : 항상 통과후 필요시 MUC로 삭제).
; Can be used in conjunction with MIIIME Universal Cleaner (MUC) (SmartSkip=2: Always skip and delete with MUC if necessary).

SmartSkip=2

; 형식 : 경로\삭제할 항목 (와일드카드 지원).
; Format : Path\DeleteItem (Wildcards supported).

; ======================================================================
; 지원 와일드카드 / Supported wildcards
; ======================================================================
; [CleanupExclude] 와 동일 / Same as [CleanupExclude]
;
; ~  →  0개 이상의 임의 문자 / Any number of any characters.
; ^  →  정확히 1개의 임의 문자 / Exactly one character (any).

; 예시 : 16자리 임의 문자 파일명의 .json 삭제.
; Example : .json with 16-character random character file name is deleted.
01={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json

; 예시 : 폴더 하나를 통째로 삭제.
; Example : Delete an entire folder.
02={Dat}\profile\startupCache

[Assets]
; 에셋 파일을 복사
; Copies asset files
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 에셋 복사 대상 경로는 기본적으로 {Dat} / {Run} 아래로 제한됨. 런처 폴더 자체 등 공통 보호 경로는 항상 차단됨.
; Asset destinations are limited to {Dat} / {Run} by default. Common protected paths (e.g. the launcher folder itself) are always blocked.

; App\Ext\Ast 폴더가 있을 때만 동작.
; Only active when App\Ext\Ast folder exists.

; SmartSkip=0 : 항상 실행 / Always run.
; SmartSkip=1 : 경로 · 호스트 변경 감지 시에만 실행 (기본값) / Run only when env change detected (default).
;               파일은 대상이 없거나 소스가 더 새것일 때만 복사.
;               Run only when env change detected (default).
; SmartSkip=2 : 항상 통과 (비활성) / Always skip (disabled).
SmartSkip=1

; 형식 : 소스|목적지
; Format : Source|Destination

; 예시 : Ast 전체 내용을 RunPath 바로 아래에 복사.
; Example : Copy all Ast contents directly into RunPath.
01=*|{Run}

; 예시 : Lang 폴더를 RunPath\Lang_Kr 로 복사.
; Example : Copy Lang folder to RunPath\Lang_Kr.
02=Lang|{Run}\Lang_Kr

; 예시 : 특정 파일을 RunPath 아래로 복사.
; Example : Copy a specific file into RunPath.
03=license.dat|{Run}\license.dat

[UserFile]
; 사용자 파일 주입 및 회수
; Inject and retrieve user folders or files
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; 목적지 경로가 다음에 해당하면 주입·회수가 차단됨 (_bakk 복원 시에는 공통 보호 경로만 검사).
; Injection and retrieval are blocked when the destination falls under the following (_bakk recovery checks only the common protected paths).
;   - 사용자 데이터 폴더 / User data : Documents, Desktop, Downloads, Pictures, Music, Videos, Favorites, Links, Saved Games,
;     Searches, OneDrive, Dropbox, Google Drive, IntelGraphicsProfiles, .oracle_jre_usage, ntuser.dat~ , ntuser.ini
;   - AppData, Startup, {Windows} 폴더 / AppData, Startup and the {Windows} folder.
;   - 공통 보호 경로 / Common protected : 드라이브 루트, 런처 폴더와 그 상위, 프로필·Windows·ProgramFiles 루트, System32\config.
;   - {Windows}(System32, SysWOW64 포함) 와 {Docs} 하위 목적지는 기본 설정에서 차단됨.
;     Destinations under {Windows} (including System32 and SysWOW64) and {Docs} are blocked with default settings.

; 항목별 소스 파일/폴더가 Usr 폴더에 존재할 때만 동작. 일반 모드는 Dat\Usr, FreezeMode=1 은 App\RawDat\Usr 를 사용함.
; Active only when the source file or folder exists under the Usr folder: Dat\Usr in normal mode, App\RawDat\Usr when FreezeMode=1.
; ※ Dat 폴더는 처음 만들어질 때 한 번만 RawDat 에서 복사됨. 이후 RawDat\Usr 에 추가한 파일은 Dat\Usr 에도 넣거나 Dat 폴더를 삭제해야 반영됨.
; ※ Dat is copied from RawDat only once, when it is first created. Files added to RawDat\Usr later must also be put in Dat\Usr (or delete Dat).

; ※ 주의 : 고급 사용자 전용.
; ※ Cautions : Advanced users only.
; 시스템 파일 조작은 관리자 권한(RunAsAdmin=1) 필요.
; System file manipulation requires admin rights (RunAsAdmin=1).

; _bakk 복원은 SmartSkip 여부와 무관하게 항상 실행됨 (이전 세션의 _bakk가 잔류하는 경우 호스트 원본 오염 방지 목적)'
; _bakk restoration always runs regardless of SmartSkip/EnvChanged (to prevent host data contamination from leftover _bakk of previous sessions).
SmartSkip=0

; 형식 : 항목명|목적지
; Format : ItemName|Destination

; 예시 : ProgramFiles 경로에 폴더를 통째 주입 (관리자 권한 필수).
; Example : Inject an entire folder into the ProgramFiles path (admin required).
01=TargetApp|{ProgramFiles}\TargetApp

[ShortcutGuard]
; 바로가기 보호 및 종료 후 재생성 감시
; Shortcut guard and post-exit re-creation watch
; ----------------------------------------------------------------------------------------

; ── 내장 안전장치 / Built-in Safety Guard ──
; Name 항목 중 \ / : * ? " < > | 문자 또는 '..' 이 들어간 이름은 무시됨 (경로가 아닌 이름만 허용).
; Name entries containing \ / : * ? " < > | or '..' are ignored (names only, never paths).

; 실행 전 : 지정한 이름의 폴더 및 .lnk 를 _bakk 로 백업.
; 종료 후 : Wait 시간 동안 앱이 새로 만든 동일 이름의 바로가기를 삭제한 뒤, 원래 이름으로 복원.
; Before launch : Back up folders and .lnk files with the given names as _bakk.
; After exit    : For the Wait duration, delete same-named shortcuts the app re-creates, then restore the originals.

; 검사 위치 / Scan locations (6) :
;   Start Menu\Programs, Start Menu (사용자 / All Users), Desktop (사용자 / Public)
;   ※ All Users / Public 경로의 삭제는 관리자 권한이 필요함. 권한이 없으면 로그만 남기고 계속 진행.
;   ※ Deleting from All Users / Public paths requires administrator rights. Without them, only a log entry is written.

; 보호/감시할 바로가기 이름 (|이름1|이름2| 형식, 비워두면 이 섹션 전체를 사용하지 않음).
; 폴더명 또는 .lnk 확장자를 뺀 파일명과 정확히 일치해야 함 (포함 일치 아님).
; Shortcut names to protect/watch (|Name1|Name2| format, leave empty to disable this whole section).
; Must exactly match the folder name or the .lnk file name without extension (not a partial match).
Name=|TargetApp|TargetApp Manager|

; 종료 후 바로가기 재생성 감시 시간 (초). 0 = 감시 안 함 (백업/복원만 수행).
; 앱 종료 감지 시점부터 계산하므로 이후 정리 단계에 걸린 시간은 이 값에서 차감됨.
; Watch duration after exit (seconds). 0 = no watch (backup/restore only).
; Counted from the moment the app exit is detected, so time spent in later cleanup steps is deducted.
Wait=10

; 감시 중 폴링 간격 (밀리초, 최소 100).
; Polling interval during the watch (milliseconds, minimum 100).
Interval=500

[Resources]
; 런처 UI 리소스 설정
; Configure launcher UI resources
; ----------------------------------------------------------------------------------------

; App\Ext\Res 폴더가 있을 때만 동작.
; Only active when App\Ext\Res folder exists.

SmartSkip=1

; 폴더 아이콘 경로 (비워두면 미적용).
; Folder icon path (leave empty to disable).
FolderIcon=Folder.ico

; 스플래시 이미지 경로 (PNG 권장, 투명도 지원, 비워두면 미표시).
; Splash image path (PNG recommended, transparency supported, leave empty to disable).
Splash=Splash.png

; 스플래시 표시 시간 (밀리초, 기본값 1500 = 1.5초).
; Splash display duration in milliseconds (default 1500 = 1.5 seconds).
SplashDuration=1500

[Advanced]
; 고급 최적화 및 타임아웃 설정
; Advanced optimization and timeout settings
; ----------------------------------------------------------------------------------------

; 파일 이동/삭제 실패 시 재시도 횟수.
; Number of retries on file move/delete failure.
RetryLimit=10

; 재시도 간격 (밀리초).
; Retry interval (milliseconds).
RetryDelay=50

; 앱 종료 감지 후 정리 작업 시작까지 대기 시간 (밀리초).
; Wait time before starting cleanup after app exit detection (milliseconds).
CleanupWait=50

; 프로세스 생존 여부 감시 주기 (밀리초, 너무 짧으면 CPU 점유율 상승).
; Process monitoring interval (ms, too short will increase CPU usage).
ProcessCheckInterval=200

; 프로세스 종료 판단 임계값 (연속 미감지 횟수가 이 값 초과 시 종료로 판단).
; Exit threshold - process is considered exited when not detected consecutively more than this count.
ExitThreshold=2

; 로그 파일 최대 크기 (Bytes, 초과 시 .old 로 백업 후 새로 시작) 기본값 5242880 = 5MB.
; Maximum log file size in bytes (rotates to .old when exceeded) default 5242880 = 5MB.
LogRotationSize=5242880

; 임시 폴더/세션 ID용 UUID 양끝 트리밍 길이.
; Characters to trim from both ends of UUID for temp folder/session ID.
GuidTrimLen=1

; 최소 요구 OS 빌드 번호 (0=미사용, 미충족 시 경고 후 종료).
; Minimum required OS build number (0=disabled, exits with warning if not met).
; 참고 빌드 : Win10 1903=18362 / Win10 21H2=19044 / Win11=22000 / Win11 23H2=22631
; Reference builds : Win10 1903=18362 / Win10 21H2=19044 / Win11=22000 / Win11 23H2=22631
MinOSBuild=0

; ── [RegistryTrace] 전용 타이밍 설정 / [RegistryTrace]-only timing settings ──

; RegistryTrace 처리 진입 전 1회 대기 시간 (밀리초).
; One-time wait before RegistryTrace processing begins (milliseconds).
; 타겟 프로세스 종료 직후 탐색기(explorer.exe)가 내부적으로 정리될 시간을 벌어줌.
; Gives Explorer a moment to settle right after the target process has exited.
TraceCleanWait=300

; explorer.exe가 "전경(foreground) 창"이 아닌 시점까지 폴링 대기할 최대 시간 (밀리초). 0=생략.
; Max time to poll-wait until explorer.exe is NOT the foreground window (ms). 0=skip this wait.
; 참고 : 이 런처 프로세스 자신의 메시지 큐 상태(GetQueueStatus)는 탐색기의 상태를 반영하지
;        못하므로, 대신 "탐색기가 전경 창인지 여부"를 더 실질적인 지표로 사용함.
;        완벽한 보장이 아닌 경험적(heuristic) 방법이며, 타임아웃되어도 정리는 계속 진행됨.
; Note : This launcher's own message-queue state (GetQueueStatus) can't reflect Explorer's
;        state, so "whether Explorer is the foreground window" is used instead as a more
;        meaningful proxy. This is a best-effort heuristic, not a guarantee -- cleanup proceeds
;        regardless once the timeout is reached.
TraceCleanIdleWait=500

; 위 TraceCleanIdleWait 대기 중 폴링 간격 (밀리초).
; Polling interval while waiting for TraceCleanIdleWait above (milliseconds).
TraceCleanPollMs=50

; [RegistryTrace] 항목을 실제로 삭제했을 때, 다음 항목 처리 전 넣는 간격 (밀리초). 기본값 0=없음.
; Delay inserted before the next entry, only when an entry was actually deleted (ms). Default 0=none.
; 값이 원래 없어 스킵된 항목은 실제 레지스트리 변경이 없으므로 이 지연이 적용되지 않음.
; Entries skipped because the value didn't exist cause no real registry change, so this delay
; does not apply to them.
; ※ 주의 : 탐색기는 짧은 시간 안에 몰린 변경 알림을 한 번에 묶어 처리하는 경향이 있음.
;    즉, 여러 RegDelete를 연속으로 빠르게 수행하면 깜빡임이 "한 번"으로 뭉쳐 보일 수 있는 반면,
;    항목 사이를 너무 길게 띄우면 오히려 깜빡임이 여러 번 "분산"되어 보일 수 있음.
;    따라서 기본값 0(지연 없음)을 권장하며, 필요한 경우에만 아주 작은 값(10~20ms 수준)부터
;    테스트하며 조정할 것.
; ※ Caution : Explorer tends to coalesce change notifications that arrive close together into
;    a single repaint. Firing several RegDelete calls back-to-back may therefore show as ONE
;    flicker, while spacing them out too much can instead cause MULTIPLE separate flickers.
;    Default 0 (no delay) is recommended; only tune upward from a very small value (10-20ms)
;    if testing shows it actually helps in your case.
TraceCleanStepDelay=0
