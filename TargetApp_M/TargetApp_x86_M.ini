; MIIIME Hybrid Launcher Configuration Guide
; ⓒ 2026 MIIIME

[Launch]
CrashRecovery=1
RunAsAdmin=0
LauncherName=TargetApp MIIIME Launcher
AppName=TargetApp
ExeName=TargetApp.exe
UniqueMutex=TargetApp_MIIIME_Mutex
AllowMultipleInstances=0
HostInstallCheck=0
WorkDir=

[Directories]
RunPath=App\TargetApp_x86
RawDataPath=App\RawDat
ExtPath=App\Ext
DataPath=Dat

[Environment]
;CommonFilesDir=D:\MySharedLibs
;_MIIIMEEnvDir=D:\MyMIIIMEEnv
;TargetApp_HOME={Run}
;TargetApp_USERHOME={Run}
;PATH01={Env}\System32
;PATH02={Env}\SysWOW64

[Options]
UseJunction=1
FreezeMode=0
DetectReadOnly=0
ExitNotice=0
LogLevel=0
;AddCommand=-profile "{Dat}\profile"

[ProcessWatch]
;01=updater.exe
;02=crashpad_handler.exe

[ProcessKill]
;01=updater.exe
;02=bin\helper.exe

[Registry]
SmartSkip=0
;01=HKEY_CURRENT_USER\SOFTWARE\VendorName\TargetApp
;02=HKEY_LOCAL_MACHINE\SOFTWARE\RegisteredApplications|TargetApp

[RegistryRoot]
SmartSkip=0
;01=HKEY_CURRENT_USER\SOFTWARE\VendorName

[RegistryShell]
SmartSkip=0
;01=Directory|TargetApp_Open|Open with TargetApp|"{Exe}" "%1"|"{Exe}"
;02=.mxe|TargetApp_Edit|Edit with TargetApp|"{Exe}" -edit "%1"

[RegistryAssoc]
SmartSkip=0
;Scope=HKCU
HostSkip=1
;01=.mxe|TargetApp.mxe|TargetApp Document|{Exe},0|"{Exe}" "%1"

[ShellExt]
SmartSkip=0
;Dll={Run}\TargetExt.dll
HostSkip=1
Threading=Apartment
;01=CLSID|{00000000-0000-0000-0000-000000000000}
;02=Handler|*,Directory,Folder|ContextMenuHandlers|TargetExt|{00000000-0000-0000-0000-000000000000}
;03=Approved|{00000000-0000-0000-0000-000000000000}|TargetExt Shell Extension
;04=CLSID|{00000000-0000-0000-0000-000000000001}|{Run}\TargetThumb.dll

[RegistryFix]
SmartSkip=1
;01=HKEY_LOCAL_MACHINE\SOFTWARE\VendorName\Updater~|ImagePath|{Run}\updater.exe
;02=HKEY_CURRENT_USER\Software\VendorName\TargetApp|InstallPath|{Run}

[FileWrite]
SmartSkip=1
;01={Run}\settings.ini|Section:Main|Key:SavePath|{Dat}\Saves

[CleanupExclude]
SmartSkip=2
;01={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json
;02={Dat}\profile\places.sqlite

[CleanupDelete]
SmartSkip=2
;01={Roaming}\Obsidian\^^^^^^^^^^^^^^^^.json
;02={Dat}\profile\startupCache

[Assets]
SmartSkip=1
;01=*|{Run}
;02=Lang|{Run}\Lang_Kr

[UserFile]
SmartSkip=0
;01=TargetApp|{ProgramFiles}\TargetApp

[ShortcutGuard]
Name=|TargetApp|TargetApp Manager|
Wait=10
Interval=500

[SharedClean]
SmartSkip=2
Name=|TargetApp.~|

[TraceClean]
SmartSkip=2
Name=|{Exe}|{Launcher}|
TraceCleanWait=300
TraceCleanIdleWait=500
TraceCleanPollMs=50
TraceCleanStepDelay=0

[Resources]
SmartSkip=1
FolderIcon=Folder.ico
Splash=Splash.png
SplashDuration=1500

[Advanced]
PreLaunchDelay=0
PostLaunchDelay=0
RetryLimit=10
RetryDelay=50
CleanupWait=50
ProcessCheckInterval=200
ExitThreshold=2
LogRotationSize=5242880
GuidTrimLen=1
MinOSBuild=0